<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Movie Recommend{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f7f8fb; }
    .navbar { background: #10131a; }
    .movie-card img { aspect-ratio: 16 / 10; object-fit: cover; }
    .movie-hero { max-height: 420px; object-fit: cover; width: 100%; }
    .section-title { border-left: 5px solid #dc3545; padding-left: .75rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'home' %}">Movie Recommend</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">トップ</a></li>
          {% if user.is_authenticated %}
            <li class="nav-item"><a class="nav-link" href="{% url 'mypage' %}">マイページ</a></li>
            <li class="nav-item">
              <form method="post" action="{% url 'account_logout' %}">
                {% csrf_token %}
                <button class="btn btn-outline-light btn-sm" type="submit">ログアウト</button>
              </form>
            </li>
          {% else %}
            <li class="nav-item"><a class="btn btn-danger btn-sm" href="{% url 'account_login' %}">ログイン</a></li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} mb-3">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
